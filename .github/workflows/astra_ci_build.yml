name: ASTRA AI Cloud Builder & Standalone EXE Compiler

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows-executables:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter pillow psutil

      - name: Validate Python Syntax Across All Modules
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Filter *.py -Recurse | ForEach-Object {
            Write-Host "Checking $($_.FullName)..."
            python -m py_compile $_.FullName
          }

      - name: Compile MyVoiceZoo Mod Menu Standalone EXE
        shell: pwsh
        run: |
          pyinstaller --onefile --noconsole --name "MyVoiceZoo_Mod_Menu_v6" "4_Astra_Unity_Mono_Mod_Menus/MYVOICEZOO_MOD_MENU.py"

      - name: Upload Compiled Windows EXE & Portfolio Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Astra-Windows-EXE-And-Suite
          path: |
            dist/*.exe
            1_Daffa_Master_Command_Center/
            4_Astra_Unity_Mono_Mod_Menus/
            5_Blender_3D_Packaging_Pipeline/
